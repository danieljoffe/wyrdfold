packages:
  - 'apps/*'

# pnpm 10 reads overrides/onlyBuiltDependencies from HERE, not from
# package.json's "pnpm" field — that block was silently ignored since the
# pnpm 10 upgrade (the WARN on every install). Moved 2026-07-15, plus two
# new advisory pins (GHSA-x9g3-xrwr-cwfg piscina, GHSA-mx8g-39q3-5c79
# webpack-dev-server) so the osv-scanner CI gate starts green.
overrides:
  adm-zip: '>=0.6.0' # GHSA-xcpc-8h2w-3j85 zip-slip (transitive dev-only, @nx module-federation)
  axios: ^1.18.0 # GHSA-gcfj-64vw-6mp9 + cluster (was ^1.16.0 → resolved vuln 1.16.1)
  tmp: ^0.2.4
  form-data: ^4.0.6
  js-yaml: ^4.3.0 # GHSA-52cp-r559-cp3m (was ^4.2.0, which still allowed the vuln)
  body-parser: '>=1.20.6' # GHSA-v422-hmwv-36x6 DoS
  brace-expansion: 5.0.9 # GHSA-mh99-v99m-4gvg + GHSA-3jxr-9vmj-r5cp + GHSA-rgw5-rvv9-x895 ReDoS. Broad (all majors) — 1.x/2.x shipped NO in-line fix (latest 1.1.16/2.1.2 are the flagged versions), so the 5.0.x line is the only patched track; bumped 5.0.8→5.0.9 for the new GHSA-rgw5-rvv9-x895 advisory. Live-DB OSV gate moving target, independent of any single PR.
  # image-size: intentionally NOT pinned — every version through the latest
  # (2.0.2) is flagged with no fix published. Suppressed in osv-scanner.toml
  # with justification instead. See GHSA-5p2g-fcmc-qvqq.
  nanoid: ^3.3.17 # GHSA-2v37-7h3g-55p8 (was 3.3.16)
  '@opentelemetry/core': 2.8.0
  '@opentelemetry/resources': 2.8.0
  '@opentelemetry/sdk-trace-base': 2.8.0
  '@typescript-eslint/utils': 8.58.2
  '@typescript-eslint/type-utils': 8.58.2
  '@typescript-eslint/eslint-plugin': 8.58.2
  '@typescript-eslint/parser': 8.58.2
  '@typescript-eslint/types': 8.58.2
  '@typescript-eslint/typescript-estree': 8.58.2
  '@typescript-eslint/visitor-keys': 8.58.2
  '@typescript-eslint/scope-manager': 8.58.2
  'next>postcss': 8.5.23 # GHSA-r28c-9q8g-f849 + GHSA-fxqj-rqcc-2cmp (8.5.20 became vulnerable to the new GHSA-fxqj advisory; fix ≥8.5.23, which is already elsewhere in the tree)
  uuid: ^11.1.1
  vite: 7.3.5
  '@vitest/browser': '>=4.1.6'
  esbuild: ^0.28.1
  undici: ^7.29.0 # GHSA-4cwx-7wf7-3272 + GHSA-8xcm-r25x-g524 + GHSA-jr45-8vmc-qm54 + GHSA-m8rv-5g2x-5cg5 + GHSA-v3r7-h72x-cjcm (7.28.0 flagged; fix 7.29.0). Live-DB OSV moving target.
  fast-uri: ^3.1.5 # GHSA-7p8r-x3mc-p8w7 ReDoS (3.1.4 flagged; fix 3.1.5). Pinned to the 3.x patched line — a bare >=3.1.5 pulls the 4.x major (breaking for the ajv consumers). Live-DB OSV moving target.
  ip-address: ^10.2.1 # GHSA-22jq-vg5j-6vgg (10.2.0 flagged; fix 10.2.1). ^ to stay on the 10.x line. Live-DB OSV moving target.
  dompurify: ^3.4.11
  piscina: 4.9.3
  webpack-dev-server: 5.2.5
  linkify-it: '^5.0.2' # GHSA-v245-v573-v5vm ReDoS (transitive via markdown-it, which wants ^5; stay on 5.x — bare >=5.0.2 pulled an untested 6.0.0 major)
  sharp: '>=0.35.0' # GHSA-f88m-g3jw-g9cj (transitive 0.34.5 pinned by next; direct dep is already ^0.35.3)

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@sentry/cli'
  - '@swc/core'
  - esbuild
  - nx
  - oxc-resolver
  - supabase
  - unrs-resolver
