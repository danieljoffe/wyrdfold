version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      # Nx packages must move together (core + every @nx/* plugin share a
      # version). Grouping all update types — majors included — keeps a
      # major bump like 22 -> 23 as ONE coordinated PR instead of a swarm
      # of per-plugin PRs that conflict in the lockfile.
      nx:
        patterns:
          - 'nx'
          - '@nx/*'
          - '@nrwl/*'
        update-types:
          - major
          - minor
          - patch
      npm-minor-patch:
        # `patterns` defaults to '*', so this group matches every dependency
        # and can claim the `@nx/*` plugins before the `nx` group above ever
        # sees them. That is not hypothetical: on 2026-09-06 it split the nx
        # family across two PRs -- #1020 carried `nx` core 23.1.2 -> 23.2.0
        # while #1022 carried every `@nx/*` plugin on the same bump. Either
        # one merged alone leaves core and plugins on different versions, and
        # the project graph dies with `hashDaemonClientEnv is not a function`
        # (that helper is new in 23.2.0, so 23.2.0 plugins calling into a
        # 23.1.2 core find nothing there).
        #
        # Excluding them here forces the whole nx family into the `nx` group
        # no matter how group precedence resolves.
        exclude-patterns:
          - 'nx'
          - '@nx/*'
          - '@nrwl/*'
        update-types:
          - minor
          - patch

  - package-ecosystem: uv
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly

  # Keeps the pinned python:3.14-slim base-image digest in apps/wyrdfold-api/
  # Dockerfile fresh, so the pin (added for reproducible Trivy scans, #192)
  # auto-bumps for CVE patches instead of going stale.
  - package-ecosystem: docker
    directory: /apps/wyrdfold-api
    target-branch: develop
    schedule:
      interval: weekly
