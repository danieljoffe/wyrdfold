version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      # Nx packages must move together (core + every @nx/* plugin share a
      # version). Grouping all update types — majors included — keeps a
      # major bump like 22 -> 23 as ONE coordinated PR instead of a swarm
      # of per-plugin PRs that conflict in the lockfile.
      nx:
        patterns:
          - 'nx'
          - '@nx/*'
          - '@nx*'
          - '@nrwl/*'
          - '@nrwl*'
        update-types:
          - major
          - minor
          - patch
      npm-minor-patch:
        # OBSERVED 2026-09-06: despite the `nx` group above listing
        # `@nx/*`, Dependabot put `nx` core in the `nx` group (#1020) and all
        # eight `@nx/*` plugins in THIS group (#1022), on the same 23.1.2 ->
        # 23.2.0 bump. Split that way, whichever PR merges alone leaves core
        # and plugins on different versions and the project graph dies with
        # `hashDaemonClientEnv is not a function` -- that helper is new in
        # 23.2.0, so 23.2.0 plugins calling into a 23.1.2 core find nothing.
        #
        # WHY it split is NOT established. GitHub's docs say a dependency
        # "is included in the first group that it matches", and `nx` is
        # declared first -- so on the documented behaviour this should not
        # have happened at all. Treat the cause as unknown (likely a quirk in
        # how scoped patterns match) rather than trusting the ordering.
        #
        # This exclusion is the part that IS documented: "If a dependency
        # matches both a pattern and an exclude-pattern, then it is excluded
        # from the group." So nx packages can no longer land here silently
        # paired with a mismatched core, whatever the grouping quirk is.
        # `@nx*` / `@nrwl*` are belt-and-braces in case the slash in the
        # `@nx/*` form is what failed to match.
        exclude-patterns:
          - 'nx'
          - '@nx/*'
          - '@nx*'
          - '@nrwl/*'
          - '@nrwl*'
        update-types:
          - minor
          - patch

  - package-ecosystem: uv
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly

  # Keeps the pinned python:3.14-slim base-image digest in apps/wyrdfold-api/
  # Dockerfile fresh, so the pin (added for reproducible Trivy scans, #192)
  # auto-bumps for CVE patches instead of going stale.
  - package-ecosystem: docker
    directory: /apps/wyrdfold-api
    target-branch: develop
    schedule:
      interval: weekly
