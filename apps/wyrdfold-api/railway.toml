[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/wyrdfold-api/Dockerfile"

# WATCH PATHS MUST COVER EVERY BUILD INPUT, NOT JUST THE SERVICE DIRECTORY.
#
# Railway rebuilds only when a changed file matches one of these. The Docker
# build context is the MONOREPO ROOT (the Dockerfile does `COPY pyproject.toml
# uv.lock ./`), so the image depends on files that do NOT live under
# apps/wyrdfold-api/.
#
# Before this existed, the filter covered only the service directory. A Python
# dependency bump changes the ROOT uv.lock and nothing else, so Railway
# reported SKIPPED and no image was built.
#
# The effect was not that dependency bumps never shipped — it is subtler and
# worse than that. They shipped LATE, silently, carried into an image by the
# next unrelated commit that happened to touch apps/wyrdfold-api/**. So the
# deployed dependency set was never what any release said it was; it was
# whatever uv.lock contained when some other change last forced a rebuild.
# A security bump could sit unbuilt indefinitely for want of an unrelated edit.
#
# Observed 2026-09-16: `main` was at anthropic 1.5.0 while production ran an
# image built from c006bcbe (1.4.0). The stranded release changed exactly one
# file, root uv.lock, matching no watch pattern. The three prior bumps
# (1.2.0, 1.3.0, 1.4.0) had each landed only via a later piggybacking commit.
#
# This failure is invisible by construction: SKIPPED is a success state, the
# API stays healthy, and /version keeps reporting the older commit — which
# reads as "that release contained no API changes" rather than "the API change
# never shipped".
#
# tests/test_deploy_config.py derives the required paths from the Dockerfile's
# own COPY lines, so a new build input cannot be added without either
# extending this list or failing the build.
watchPatterns = [
  "apps/wyrdfold-api/**",
  "pyproject.toml",
  "uv.lock",
]

# NOTE: Railway config-as-code only covers the build/deploy SETTINGS sections
# — it cannot define service environment variables (those live in the Railway
# dashboard / CLI `railway variables`). Set these there for production:
#   - SENTRY_ENVIRONMENT=production   (so Sentry tags events as prod; the
#     default in app/config.py is "development")
#   - DEBUG_ERRORS is intentionally LEFT UNSET → fail-closed generic 500
#     bodies. The 500 handler in app/main.py no longer keys verbose error
#     detail off SENTRY_ENVIRONMENT (that was fail-open, audit #29 R3 / H5);
#     it is generic by default and only verbose when DEBUG_ERRORS=true.

[deploy]
# No startCommand on purpose (#29 C1): the start command is the Dockerfile CMD
# (uvicorn WITH --proxy-headers). A [deploy].startCommand OVERRIDES that CMD,
# and the previous one ran `uv run …` — uv is builder-only, absent from the
# runtime image, so it resolved to `uv: not found` — and it dropped
# --proxy-headers (without which uvicorn trusts the LB IP for every request,
# collapsing the pre-auth rate-limit buckets). The Dockerfile CMD is the single
# source of truth; test_deploy_config.py guards this.
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
